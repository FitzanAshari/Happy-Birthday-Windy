        /* Three.js Heart Gift (Bentuk Love Romantis) */
        function createCenteredHeartShape(scale = 1) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0.35 * scale);
            shape.bezierCurveTo(0, 0.75 * scale, -0.6 * scale, 1.1 * scale, -1.0 * scale, 0.75 * scale);
            shape.bezierCurveTo(-1.45 * scale, 0.35 * scale, -1.25 * scale, -0.45 * scale, 0, -1.25 * scale);
            shape.bezierCurveTo(1.25 * scale, -0.45 * scale, 1.45 * scale, 0.35 * scale, 1.0 * scale, 0.75 * scale);
            shape.bezierCurveTo(0.6 * scale, 1.1 * scale, 0, 0.75 * scale, 0, 0.35 * scale);
            return shape;
        }

        function createCenteredHeartHolePath(scale = 1) {
            const path = new THREE.Path();
            path.moveTo(0, 0.35 * scale);
            path.bezierCurveTo(0, 0.75 * scale, 0.6 * scale, 1.1 * scale, 1.0 * scale, 0.75 * scale);
            path.bezierCurveTo(1.45 * scale, 0.35 * scale, 1.25 * scale, -0.45 * scale, 0, -1.25 * scale);
            path.bezierCurveTo(-1.25 * scale, -0.45 * scale, -1.45 * scale, 0.35 * scale, -1.0 * scale, 0.75 * scale);
            path.bezierCurveTo(-0.6 * scale, 1.1 * scale, 0, 0.75 * scale, 0, 0.35 * scale);
            return path;
        }

        function createPolkaTexture(baseColor, dotColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = dotColor;
            for (let x = 18; x < 256; x += 36) {
                for (let y = 18; y < 256; y += 36) {
                    ctx.beginPath();
                    ctx.arc(x, y, 7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // Pita Bunga Mekar Sutra Putih Mutiara
        function createBowMesh(mat) {
            const bowGroup = new THREE.Group();

            const countOuter = 8;
            for (let i = 0; i < countOuter; i++) {
                const ang = (i / countOuter) * Math.PI * 2;
                const loopGeo = new THREE.TorusGeometry(0.32, 0.075, 12, 24, Math.PI * 1.25);
                const loopMesh = new THREE.Mesh(loopGeo, mat);
                loopMesh.position.set(Math.cos(ang) * 0.22, 0.08, Math.sin(ang) * 0.22);
                loopMesh.rotation.y = ang;
                loopMesh.rotation.x = Math.PI / 3.4;
                loopMesh.scale.set(1.0, 1.25, 0.85);
                loopMesh.castShadow = true;
                bowGroup.add(loopMesh);
            }

            const countInner = 6;
            for (let i = 0; i < countInner; i++) {
                const ang = (i / countInner) * Math.PI * 2 + Math.PI / countInner;
                const loopGeo = new THREE.TorusGeometry(0.20, 0.065, 10, 20, Math.PI * 1.15);
                const loopMesh = new THREE.Mesh(loopGeo, mat);
                loopMesh.position.set(Math.cos(ang) * 0.12, 0.15, Math.sin(ang) * 0.12);
                loopMesh.rotation.y = ang;
                loopMesh.rotation.x = Math.PI / 2.6;
                loopMesh.scale.set(0.9, 1.2, 0.8);
                loopMesh.castShadow = true;
                bowGroup.add(loopMesh);
            }

            const centerGeo = new THREE.SphereGeometry(0.12, 20, 20);
            centerGeo.scale(1.1, 0.95, 1.1);
            const centerMat = new THREE.MeshStandardMaterial({
                color: 0xfffdf7,
                roughness: 0.15,
                metalness: 0.35,
                emissive: 0xfff0f5,
                emissiveIntensity: 0.15
            });
            const centerMesh = new THREE.Mesh(centerGeo, centerMat);
            centerMesh.position.y = 0.18;
            centerMesh.castShadow = true;
            bowGroup.add(centerMesh);

            [-1, 1].forEach(side => {
                const tailGeo = new THREE.BoxGeometry(0.18, 0.65, 0.02);
                const tailMesh = new THREE.Mesh(tailGeo, mat);
                tailMesh.position.set(side * 0.28, -0.22, 0.22);
                tailMesh.rotation.set(0.38, 0, side * -0.38);
                tailMesh.castShadow = true;
                bowGroup.add(tailMesh);
            });

            return bowGroup;
        }

        function initHeartGift() {
            const container = document.getElementById('heart-gift-canvas');
            if (!container || typeof THREE === 'undefined') return;

            const hero = document.querySelector('.hero');
            const width = (hero ? hero.clientWidth : window.innerWidth) || 400;
            const height = (hero ? hero.clientHeight : window.innerHeight) || 800;

            function getCamDist() {
                const w = (hero ? hero.clientWidth : window.innerWidth) || 400;
                const h = (hero ? hero.clientHeight : window.innerHeight) || 800;
                const aspect = w / h;
                const tanHalfFov = Math.tan((20 * Math.PI) / 180);
                const d = 4.1 / (2.0 * tanHalfFov * aspect);
                return Math.max(9.0, Math.min(16.0, d));
            }
            let camDist = getCamDist();

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
            camera.position.set(0, 0.65 + camDist * 0.16, camDist * 1.04);
            camera.lookAt(0, 0.65 + camDist * 0.26, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                if (!hero) return;
                const w = hero.clientWidth;
                const h = hero.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
                camDist = getCamDist();
            });

            const amb = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(amb);

            const dir = new THREE.DirectionalLight(0xfff5ea, 1.3);

            const fill = new THREE.PointLight(0xf472b6, 1.2, 10);

            });

            const initialLidY = hHeight + 0.08;

            // Generator Tekstur Kilau Bintang 3D (Fairy Dust)
            function createSparkleTexture() {
                const c = document.createElement('canvas');
                c.width = 64;
                c.height = 64;
                const ctx = c.getContext('2d');

                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.25, 'rgba(254, 240, 138, 0.95)');
                grad.addColorStop(0.55, 'rgba(244, 114, 182, 0.45)');
                grad.addColorStop(1, 'rgba(244, 114, 182, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 64, 64);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(32, 8);
                ctx.lineTo(32, 56);
                ctx.moveTo(8, 32);
                ctx.lineTo(56, 32);
                ctx.stroke();

                return new THREE.CanvasTexture(c);
            }

            const stardustCount = 48;
            const stardustGeo = new THREE.BufferGeometry();
            const stardustPositions = new Float32Array(stardustCount * 3);
            const stardustSpeeds = new Float32Array(stardustCount);
            const stardustDrifts = new Float32Array(stardustCount);

            for (let i = 0; i < stardustCount; i++) {
                stardustPositions[i * 3 + 0] = (Math.random() - 0.5) * 6.5;
                stardustPositions[i * 3 + 1] = -0.5 + Math.random() * 4.8;
                stardustPositions[i * 3 + 2] = (Math.random() - 0.5) * 5.5;
                stardustSpeeds[i] = 0.0025 + Math.random() * 0.005;
                stardustDrifts[i] = Math.random() * Math.PI * 2;
            }

            stardustGeo.setAttribute('position', new THREE.BufferAttribute(stardustPositions, 3));

            const stardustMat = new THREE.PointsMaterial({
                size: 0.18,
                map: createSparkleTexture(),
                transparent: true,
                opacity: 0.65,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const stardustPoints = new THREE.Points(stardustGeo, stardustMat);
            scene.add(stardustPoints);

            let lidOpenProgress = 0;
            let clock = new THREE.Clock();

            function renderHeart() {
                requestAnimationFrame(renderHeart);
                const time = clock.getElapsedTime();

                const finalCamY = 0.65 + camDist * 0.45;
                const finalCamZ = camDist;
                const finalLookY = 0.65;
                const startCamY = 0.65 + camDist * 0.16;
                const startCamZ = camDist * 1.04;
                const startLookY = 0.65 + camDist * 0.26;
                const dropHeight = camDist * 0.35;

                if (time < 2.85) {
                    if (time < 0.20) {
                        lidGroup.position.y = initialLidY + dropHeight;
                        lidGroup.position.x = 0;
                        lidGroup.position.z = 0;
                        lidGroup.rotation.set(0.12, Math.PI * 3.0, -0.10);
                        baseGroup.position.y = 0;
                        baseGroup.scale.set(1, 1, 1);

                        camera.position.set(0, startCamY, startCamZ);
                        camera.lookAt(0, startLookY, 0);
                    } else if (time < 2.35) {
                        const p = (time - 0.20) / 2.15;
                        const pRot = 1 - p;
                        const easedY = Math.pow(p, 1.85);

                        lidGroup.position.y = initialLidY + dropHeight * (1 - easedY);
                        lidGroup.position.x = Math.sin(pRot * Math.PI * 2.2) * 0.16 * pRot;
                        lidGroup.position.z = Math.cos(pRot * Math.PI * 2.2) * 0.10 * pRot;

                        lidGroup.rotation.y = Math.pow(pRot, 1.25) * (Math.PI * 3.0);
                        lidGroup.rotation.x = Math.sin(pRot * Math.PI * 2.2) * 0.15 * pRot;
                        lidGroup.rotation.z = -Math.cos(pRot * Math.PI * 2.0) * 0.12 * pRot;

                        baseGroup.position.y = 0;
                        baseGroup.scale.set(1, 1, 1);

                        const easeCam = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
                        const curCamY = startCamY + (finalCamY - startCamY) * easeCam;
                        const curCamZ = startCamZ + (finalCamZ - startCamZ) * easeCam;
                        camera.position.set(0, curCamY, curCamZ);

                        const curLookY = startLookY + (finalLookY - startLookY) * easeCam;
                        camera.lookAt(0, curLookY, 0);
                    } else {
                        const tc = (time - 2.35);
                        const decay = Math.exp(-7.5 * tc);
                        const osc = Math.sin(16.0 * tc);

                        lidGroup.position.x = 0;
                        lidGroup.position.z = 0;
                        lidGroup.rotation.y = 0;
                        lidGroup.rotation.x = 0;

                        const bounce = Math.max(0, 0.18 * decay * osc);
                        lidGroup.position.y = initialLidY + bounce;
                        lidGroup.rotation.z = 0.025 * decay * Math.cos(16.0 * tc);

                        const squash = 0.07 * decay * osc;
                        baseGroup.scale.set(1.0 + squash * 0.45, 1.0 - squash * 0.85, 1.0 + squash * 0.45);
                        baseGroup.position.y = -squash * 0.06;

                        camera.position.set(0, finalCamY, finalCamZ);
                        camera.lookAt(0, finalLookY, 0);
                    }
                } else if (!window.__isHeartOpening) {
                    lidGroup.position.set(0, initialLidY, 0);
                    lidGroup.rotation.set(0, 0, 0);
                    baseGroup.position.y = 0;
                    baseGroup.scale.set(1, 1, 1);
                    camera.position.set(0, finalCamY, finalCamZ);
                    camera.lookAt(0, finalLookY, 0);
                }

                // 2. Animasi Membuka Kado: Tutup kecampak ke atas, badan kado kecampak ke bawah!
                if (window.__isHeartOpening) {
                    lidOpenProgress += (1 - lidOpenProgress) * 0.085;
                    const pFling = Math.pow(lidOpenProgress, 1.35);

                    // TUTUP KADO KECAMPAK KE ATAS & KELUAR LAYAR
                    lidGroup.position.y = initialLidY + pFling * 16.5;
                    lidGroup.position.z = -pFling * 6.0;
                    lidGroup.rotation.x = -pFling * 2.8;
                    lidGroup.rotation.z = pFling * 1.9;

                    // BADAN KADO KECAMPAK JATUH KE BAWAH & KELUAR LAYAR
                    baseGroup.position.y = -pFling * 14.0;
                    baseGroup.position.z = pFling * 2.0;
                    baseGroup.rotation.x = pFling * 1.5;
                    baseGroup.rotation.z = -pFling * 0.8;

                    // Cahaya dari dalam rongga
                    innerGlowLight.intensity = Math.max(0, (1 - lidOpenProgress) * 4.0);
                } else if (window.__dragLiftProgress > 0) {
                    const d = window.__dragLiftProgress;
                    lidGroup.position.y = initialLidY + d * 0.85;
                    lidGroup.rotation.x = -d * 0.32;
                    lidGroup.position.z = -d * 0.45;
                    innerGlowLight.intensity = d * 1.2;
                } else if (time >= 2.85) {
                    const tIdle = time - 2.85;
                    const rawBlend = Math.min(1.0, tIdle / 1.5);
                    const blend = rawBlend * rawBlend * (3.0 - 2.0 * rawBlend);

                    const floatY = Math.sin(tIdle * 1.8) * 0.12 * blend;
                    giftRoot.position.y = floatY;

                    const pulse = 1.0 + (1.0 - Math.cos(tIdle * 1.8)) * 0.012 * blend;
                    giftRoot.scale.set(pulse, pulse, pulse);

                    giftRoot.rotation.y = Math.sin(tIdle * 0.9) * 0.11 * blend;
                    giftRoot.rotation.z = Math.sin(tIdle * 0.45) * 0.02 * blend;
                }

                // Animasi 3D Fairy Dust melayang lembut
                const posArr = stardustGeo.attributes.position.array;
                for (let i = 0; i < stardustCount; i++) {
                    posArr[i * 3 + 1] += stardustSpeeds[i];
                    if (posArr[i * 3 + 1] > 4.5) {
                        posArr[i * 3 + 1] = -0.5;
                        posArr[i * 3 + 0] = (Math.random() - 0.5) * 6.5;
                        posArr[i * 3 + 2] = (Math.random() - 0.5) * 5.5;
                    }
                    posArr[i * 3 + 0] += Math.sin(time * 1.2 + stardustDrifts[i]) * 0.002;
                }
                stardustGeo.attributes.position.needsUpdate = true;
                stardustPoints.rotation.y = time * 0.04;

                renderer.render(scene, camera);
            }
            renderHeart();
        }

        initHeartGift();
    </script>
</body>
